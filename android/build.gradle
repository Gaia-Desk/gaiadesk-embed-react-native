// The Android half of @gaiadesk/embed-react-native: the `GaiaDeskEmbed`
// native module (Kotlin) over net.gaiadesk:embed-android. A TurboModule
// when the app builds with newArchEnabled=true (codegen from
// ../src/NativeGaiaDeskEmbed.ts), a classic bridge module otherwise.

buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["GaiaDeskEmbed_" + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["GaiaDeskEmbed_" + name]).toInteger()
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

android {
  namespace "net.gaiadesk.reactnative"
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    // net.gaiadesk:embed-android needs Android 8.0 (API 26).
    minSdkVersion Math.max(26, getExtOrIntegerDefault("minSdkVersion"))
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ["src/newarch/java"]
      } else {
        java.srcDirs += ["src/oldarch/java"]
      }
    }
  }
}

// net.gaiadesk:embed-android: the published AAR from Maven Central by default.
// Overrides (the app's android/gradle.properties, rootProject.ext, or env vars):
//   GaiaDeskEmbed_embedAndroidVersion=<v>        another published version (the
//                                                default below is the one this release is tested with)
//   GaiaDeskEmbed_embedAndroidMavenLocal=true    (GAIADESK_EMBED_ANDROID_MAVEN_LOCAL=1)
//       resolve it from ~/.m2 too: `./gradlew :embed:publishToMavenLocal` in
//       gaiadesk-embed-android (adds mavenLocal() to every project of the build)
//   GaiaDeskEmbed_embedAndroidAar=/path/to.aar   (GAIADESK_EMBED_ANDROID_AAR)
//       a local AAR file instead (an app build only: AGP refuses a local .aar
//       inside this library's own AAR, so not `./gradlew assembleRelease` at the root)
def embedAndroidVersion = getExtOrDefault("embedAndroidVersion") ?: "0.1.0"
def embedAndroidAar = getExtOrDefault("embedAndroidAar") ?: System.getenv("GAIADESK_EMBED_ANDROID_AAR")
def embedAndroidMavenLocal = ((getExtOrDefault("embedAndroidMavenLocal") ?: System.getenv("GAIADESK_EMBED_ANDROID_MAVEN_LOCAL")) ?: "").toString() in ["1", "true"]

if (embedAndroidMavenLocal) {
  rootProject.allprojects { repositories { mavenLocal() } }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // The version comes from the app's React Native Gradle plugin.
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  if (embedAndroidAar) {
    implementation files(embedAndroidAar)
  } else {
    implementation "net.gaiadesk:embed-android:${embedAndroidVersion}"
  }
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "RNGaiaDeskEmbedSpec"
    codegenJavaPackageName = "net.gaiadesk.reactnative"
  }
}
